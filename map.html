
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raider Bucks Map</title>

    <style>
        body {
            background-color: #484242;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header {
            background-color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 25px;
            color: #192333;
        }

        h1 span {

        }

            text-decoration: none;

            margin-left: 20px;

        nav a:hover {

        }

        main {
            display: flex;
            background-color: white;
            min-height: 600px;
        }

            width: 72%;
            padding-top: 20px;
        }

        .search {

            padding: 15px;

        .search input {

        .map-area img {

            height: auto;
        }

            width: 28%;
            padding: 10px;
        }

        .dining h2 {
            font-size: 27px;
            font-weight: normal;
        }

        .location {
            margin-bottom: 30px;
        }

        .location h3 {
            margin-bottom: 0;
            font-size: 20px;
        }

        .location p {
            margin-top: 0;

        }

        footer {

</head>

<body>

    <header>
        <h1><span>RAIDER</span> BUCKS</h1>

        <nav>
            <a href="home.html">Home</a>

        </nav>

    <main>

                <input type="search"

        <section class="dining">

            <div class="location">

            </div>

            <div class="location">
                <h3>Starbucks</h3>

            </div>

            <div class="location">

                <p>Hours: 8:00am-5:00pm</p>
            </div>

            <div class="location">
                <h3>Fresh Plate</h3>
                <p>Hours: 8:00am-5:00pm</p>

    <footer>
        <p>Raider Bucks - Texas Tech University</p>
    </footer>

</html>
