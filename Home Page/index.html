<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raider Buck$ Home</title>
<link rel="stylesheet" href="globals.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chris-home">
<header class="rectangle">
<div class="logo" aria-label="Raider Buck$">
<p class="raider-buck">
<span class="span">Raider</span>
<span class="text-wrapper-8">&nbsp;</span>
<span class="text-wrapper-9">Buck$</span>
</p>
<img class="image" src="img/image-1.png" alt="Texas Tech logo">
</div>
<nav aria-label="Primary navigation">
<a class="text-wrapper-10" href="#home" aria-current="page">Home</a>
<a class="text-wrapper-11" href="#balance">Balance</a>
<a class="text-wrapper-12" href="#budget">Budget</a>
<a class="text-wrapper-13" href="#map">Map</a>
</nav>
<img class="img" src="img/image.png" alt="User profile">
</header>
<main>
<section class="profile" id="home" aria-labelledby="profile-heading">
<div class="div" aria-hidden="true"></div>
<img class="PFP" src="img/PFP.png" alt="Profile avatar">
<h1 class="text-wrapper" id="profile-heading">Good Afternoon,</h1>
<p class="text-wrapper-2">[Username]</p>
</section>
<section class="budget" id="budget" aria-labelledby="budget-heading">
<div class="div" aria-hidden="true"></div>
<div class="button-b" aria-hidden="true"></div>
<h2 class="text-wrapper-3" id="budget-heading">Today’s budget is:</h2>
<p class="text-wrapper-4" aria-label="Today's budget: 200 dollars">$200.00</p>
</section>
<section class="balance" id="balance" aria-labelledby="balance-heading">
<div class="div" aria-hidden="true"></div>
<h2 class="text-wrapper-5" id="balance-heading">Your current balance is:</h2>
<div class="button-b" aria-hidden="true"></div>
<p class="text-wrapper-6" aria-label="Current balance: 1,500 dollars">$1,500.00</p>
</section>
<section class="map" id="map" aria-labelledby="map-heading">
<div class="div" aria-hidden="true"></div>
<div class="button-b-2" aria-hidden="true"></div>
<h2 class="p" id="map-heading">Find a place to spend!</h2>
<button class="text-wrapper-7" type="button">View Map</button>
<div class="pinpoint" aria-hidden="true">
<div class="ellipse"></div>
<img class="polygon" src="img/polygon-1.svg" alt="">
<div class="ellipse-2"></div>
</div>
</section>
</main>
</div>
</body>
</html>
